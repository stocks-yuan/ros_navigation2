# =============================================================================
# Nav2 参数配置 - 双阿克曼模型 (Dual Ackermann)
# 适用于：不可原地旋转的类阿克曼车辆
# 规划器：SmacPlanner (Hybrid-A* with Reeds-Shepp)
# 控制器：Regulated Pure Pursuit Controller
# =============================================================================

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "omnidirectional"  # 阿克曼无专用模型，用omni近似
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan1

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: True

    # ===== Regulated Pure Pursuit Controller - 适合阿克曼类型车辆 =====
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # ----- 速度设置 -----
      desired_linear_vel: 0.3           # 期望线速度 (底盘限制)
      max_linear_accel: 0.5             # 最大线加速度
      max_linear_decel: 0.5             # 最大线减速度
      # ----- 前视距离设置 -----
      lookahead_dist: 0.6               # 前视距离
      min_lookahead_dist: 0.3           # 最小前视距离
      max_lookahead_dist: 0.9           # 最大前视距离
      lookahead_time: 1.5               # 前视时间(速度缩放)
      use_velocity_scaled_lookahead_dist: true  # 使用速度缩放前视距离
      # ----- 转向设置 -----
      use_rotate_to_heading: false      # 阿克曼不能原地转向，禁用！
      rotate_to_heading_angular_vel: 0.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.3            # 最大角加速度 (适配低角速度)
      # ----- 接近目标设置 -----
      min_approach_linear_velocity: 0.02  # 接近目标时最小速度
      use_approach_linear_velocity_scaling: true
      goal_dist_tol: 0.15               # 目标距离容差
      # ----- 碰撞检测 -----
      max_allowed_time_to_collision: 1.0  # 最大允许碰撞时间
      # ----- 速度调节 -----
      use_regulated_linear_velocity_scaling: true   # 启用曲率调节
      use_cost_regulated_linear_velocity_scaling: true  # 启用代价调节
      cost_scaling_dist: 0.5            # 障碍物代价缩放距离
      cost_scaling_gain: 1.0            # 代价缩放增益
      inflation_cost_scaling_factor: 3.0  # 与costmap膨胀层一致
      regulated_linear_scaling_min_radius: 0.9  # 触发调节的最小转弯半径
      regulated_linear_scaling_min_speed: 0.1   # 调节后的最小速度
      # ----- TF设置 -----
      transform_tolerance: 0.1

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.44, -0.375], [0.44, -0.375], [0.44, 0.375], [-0.44, 0.375]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.078
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[-0.44, -0.375], [0.44, -0.375], [0.44, 0.375], [-0.44, 0.375]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.078
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: False

# ===== SmacPlanner (Hybrid-A*) - 适合阿克曼类型车辆，考虑运动学约束 =====
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "smac_planner/SmacPlanner"
      tolerance: 0.15                       # 目标容差(米)
      downsample_costmap: false             # 是否降采样代价地图
      downsampling_factor: 1                # 降采样因子
      allow_unknown: true                   # 允许在未知区域规划
      max_iterations: 1000000               # 最大搜索迭代次数
      max_on_approach_iterations: 1000      # 接近目标时最大迭代次数
      max_planning_time: 2.0                # 最大规划时间(秒)
      smooth_path: true                     # 是否平滑路径
      # ----- 运动模型设置 -----
      motion_model_for_search: "REEDS_SHEPP"  # 运动模型：DUBIN(只能前进) 或 REEDS_SHEPP(可倒车)
      angle_quantization_bins: 72           # 角度量化数(72 = 5度分辨率)
      minimum_turning_radius: 0.5           # 最小转弯半径(米)，根据实际底盘调整
      reverse_penalty: 2.0                  # 倒车惩罚系数
      change_penalty: 0.5                   # 方向改变惩罚
      non_straight_penalty: 1.2             # 非直线行驶惩罚
      cost_penalty: 2.0                     # 代价惩罚
      analytic_expansion_ratio: 3.5         # 解析扩展比例
      analytic_expansion_max_length: 3.0    # 解析扩展最大长度
      # ----- 路径平滑器设置 -----
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# 阿克曼车辆的恢复行为 - 禁用原地旋转
recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["back_up", "wait"]  # 移除spin，阿克曼不能原地旋转
    back_up:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.2   # 最大旋转速度 (底盘限制)
    min_rotational_vel: 0.05  # 最小旋转速度
    rotational_acc_lim: 0.3   # 旋转加速度限制

robot_state_publisher:
  ros__parameters:
    use_sim_time: True
